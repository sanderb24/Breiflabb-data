name: Oppdater breiflabb-data

on:
  workflow_dispatch:

jobs:
  hent-data:
    runs-on: ubuntu-latest

    steps:
      - name: Hent repo
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kjør test
        run: python update_breiflabb.py
