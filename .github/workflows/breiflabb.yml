name: Oppdater breiflabb-data

on:
  workflow_dispatch:

  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  hent-data:
    runs-on: ubuntu-latest

    steps:
      - name: Hent repo
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hent og filtrer fangstdata
        run: python update_breiflabb.py

      - name: Lagre ny breiflabb-fil
        run: |
          git config user.name "breiflabb-bot"
          git config user.email "breiflabb-bot@users.noreply.github.com"
          git add breiflabb_latest.csv
          if git diff --cached --quiet; then
            echo "Ingen endringer i fangstdata"
          else
            git commit -m "Oppdater breiflabb-data"
            git push
          fi
